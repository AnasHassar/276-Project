services:
  postgres:
    image: 'postgres:16'
    environment:
      POSTGRES_DB: mydatabase
      POSTGRES_PASSWORD: secret
      POSTGRES_USER: myuser
    ports:
      - '5432:5432'
    healthcheck:
      test: [ 'CMD-SHELL', 'pg_isready -U myuser -d mydatabase' ]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - postgres_data:/var/lib/postgresql/data

  app:
    build: .
    ports:
      - '8080:8080'
    environment:
      URL_DB: jdbc:postgresql://postgres:5432/mydatabase
      DB_USER: myuser
      DB_PASS: secret
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
