<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Events — SFSS Nexus</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/events.css">
</head>
<body>

<header class="site-header">
  <a href="index.html" class="site-logo"><img src="images/nexuslogo.png" alt="SFSS Nexus" class="site-logo__img"></a>
  <nav class="site-nav">
    <a href="index.html">Home</a>
    <a href="events.html" class="active">Events</a>
    <a href="clubs.html">Clubs</a>
    <a href="class-calendar.html">Classes</a>
    <span id="authLinks">
      <a href="login.html">Login</a>
      <a href="register.html">Register</a>
    </span>
  </nav>
</header>

<main class="page">

  <header class="app-header">
    <a href="index.html" class="back-link" aria-label="Back to home">←</a>
    <div>
      <p class="eyebrow">SFU campus life</p>
      <h1>Find your next thing</h1>
    </div>
    <span class="result-count" id="resultCount"></span>
  </header>

  <div class="event-toolbar">
    <div class="search-bar">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/>
      </svg>
      <input id="searchInput" type="text" placeholder="Search events, clubs, locations...">
    </div>
    <div class="events-controls">
      <div class="btn-control" id="filterBtn">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <line x1="4" y1="6" x2="20" y2="6"/><line x1="8" y1="12" x2="16" y2="12"/>
          <line x1="11" y1="18" x2="13" y2="18"/>
        </svg>
        <span>Filters</span><span class="filter-count" id="filterCount"></span>
        <div class="dropdown-panel" id="filterPanel">
          <label><input type="radio" name="srcFilter" value=""> All sources</label>
          <label><input type="radio" name="srcFilter" value="eventbrite"> Eventbrite</label>
          <label><input type="radio" name="srcFilter" value="sfu_events"> SFU Events</label>
          <label><input type="radio" name="srcFilter" value="club"> Club Events</label>
        </div>
      </div>
      <div class="btn-control" id="sortBtn">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M3 6h18M7 12h10M11 18h2"/>
        </svg>
        <span id="sortLabel">Sort: Soonest</span>
        <div class="dropdown-panel" id="sortPanel">
          <div class="sort-option active" data-sort="soonest">Sort: Soonest</div>
          <div class="sort-option" data-sort="latest">Sort: Latest first</div>
        </div>
      </div>
    </div>
  </div>

  <section class="featured-event" id="featuredEvent"></section>

  <section class="events-list" id="eventsList">
    <div class="events-loading">
      <div class="skeleton"></div>
      <div class="skeleton"></div>
      <div class="skeleton"></div>
    </div>
  </section>

</main>

<script src="js/auth.js"></script>
<script src="js/nav.js"></script>
<script src="js/events.js"></script>
<script src="js/balls.js"></script>
</body>
</html>
