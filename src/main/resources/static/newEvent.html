<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <title>Add Event</title>
</head>
<body>
    <div class="container-fluid">
        <div class="row justify-content-center">
            <div class="col-md-4">
                <h1 class="text-center mt-5 mb-4">New Event</h1> 
                    <form action="/addevent" method="post">
                        <div class="mb-3">
                            <label>Event Name</label>
                            <input type="text" id="title" name="title" class="form-control form-control" placeholder="Name" required>
                        </div>

                        <div class="mb-3">
                            <label>Associated Club</label>
                            <select id="organizer" name="organizer" class="form-control" required placeholder="Select a club or organization">
                                <option value="club-1">Placeholder Choice 1</option>
                                <option value="club-2">Placeholder Choice 2</option>
                                <option value="club-3">Placeholder Choice 3</option>
                                <option value="club-4">Placeholder Choice 4</option>
                                <option value="club-5">Placeholder Choice 5</option>
                            </select>
                        </div>

                        <div class="mb-3">
                            <label>Event Category</label>
                            <select id="tags" name="tags" class="form-control" required placeholder="Select a category">
                                <option value="cat-1">Placeholder Choice 1</option>
                                <option value="cat-2">Placeholder Choice 2</option>
                                <option value="cat-3">Placeholder Choice 3</option>
                                <option value="cat-4">Placeholder Choice 4</option>
                                <option value="cat-5">Placeholder Choice 5</option>
                            </select>
                        </div>

                        <div class="mb-3">
                            <label>Location</label>
                            <input type="text" id="location" name="location" class="form-control" required placeholder="e.g SUB Ballroom">
                        </div>

                        <div class="mb-3">
                            <label>Capacity</label>
                            <input type="number" id="attendeeCount" name="attendeeCount" class="form-control" min="1" required placeholder="e.g. 150">
                        </div>

                        <div class="mb-3">
                            <label>Start Time</label>
                            <input type="datetime-local" id="startDate" name="startDate" class="form-control" required placeholder="yyyy-mm-dd">
                        </div>

                        <div class="mb-3">
                            <label>End Time</label>
                            <input type="datetime-local" id="endDate" name="endDate" class="form-control" required placeholder="yyyy-mm-dd">
                        </div>

                        <div class="mb-3">
                            <label>Detailed description</label>
                            <input id="description" name="description" class="form-control" maxlength="1000" placeholder="Provide details about your event..."></input>
                        </div>

                        <div class="mb-3">
                            <label>Additional Links (Optional)</label>
                            <input type="url" id="url" name="url" class="form-control" placeholder="">
                        </div>

                        <div class="d-grid gap-2">
                            <input class="btn btn-primary" type="submit" value="CREATE EVENT"></input>
                        </div>
                    </form>
</body>
</html>
