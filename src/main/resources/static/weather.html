<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Weather Widget</title>
  <link rel="stylesheet" href="/css/weather.css">
</head>
<body>

  <!-- copy this widget landing page -->
  <div class="weather-widget">
    <div class="campus">SFU BURNABY</div>

    <div class="main-row">

      <div class="temp" id="temp">-</div>
      <div class="icon-area">

        <img class="icon" id="icon" src="" alt="Weather">
        <div class="condition" id="condition">Loading...</div>

        
      </div>
    </div>

    <div class="stats">

      <div class="stat">
        <div class="label">Feels like</div>
        <div class="value" id="feelsLike">-</div>
      </div>

      <div class="stat">
        <div class="label">Humidity</div>
        <div class="value" id="humidity">-</div>
      </div>

      <div class="stat">
        <div class="label">Wind</div>
        <div class="value" id="wind">-</div>
      </div>

      <div class="stat">

        <div class="label">Rain</div>
        <div class="value" id="rain">-</div>

      </div>

    </div>

    <div class="credit">Weather data by OpenWeatherMap, Icons by amCharts</div>
  </div>

  <script src="/js/weather.js"></script>
</body>
</html>
