<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin — Menu</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/events.css">
</head>
<body>

<div class="app">

  <header class="app-header">
    <a href="index.html" class="back-link" aria-label="Back to home">←</a>
    <h1>Admin Menu</h1>
    <a href="#" id="logoutLink" style="font-size:0.8rem;color:var(--red-bright);text-decoration:none;white-space:nowrap">Logout</a>
    <form id="logoutForm" method="post" action="/logout" style="display:none">
      <input type="hidden" name="_csrf" id="csrfToken" value="">
    </form>
  </header>

  <div class="card admin-form-page">
    <h2 style="margin:0 0 4px">Welcome back<span id="adminName"></span></h2>
    <p style="color:var(--text-muted);font-size:0.82rem;margin:0 0 18px">
      Pick where you'd like to go.
    </p>

    <div class="menu-grid">
      <a href="admin-users.html" class="card mini-card">
        <span class="card-icon">👥</span>
        <h3>Registered Users</h3>
        <p>See everyone who's signed up</p>
      </a>
      <a href="admin-events.html" class="card mini-card">
        <span class="card-icon">🎉</span>
        <h3>Add Events</h3>
        <p>Post a new club event</p>
      </a>
<a href="admin-clubs.html" class="card mini-card">
        <span class="card-icon">🏛️</span>
        <h3>Add Clubs</h3>
        <p>Add, edit, or remove clubs</p>
      </a>
    </div>
  </div>

</div>

<script src="js/auth.js"></script>
<script>
document.getElementById('logoutLink').addEventListener('click', (e) => {
  e.preventDefault();
  document.getElementById('logoutForm').submit();
});

fetch('/api/auth/me', { headers: { Accept: 'application/json' } })
  .then(res => (res.ok ? res.json() : null))
  .then(user => {
    if (!user) return;
    const nameEl = document.getElementById('adminName');
    if (nameEl) nameEl.textContent = ', ' + (user.fullName || user.username);
  })
  .catch(() => {});
</script>
</body>
</html>
