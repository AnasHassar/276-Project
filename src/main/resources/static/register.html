<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Register — SFSS Nexus</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<header class="site-header">
  <a href="index.html" class="site-logo"><img src="images/nexuslogo.png" alt="SFSS Nexus" class="site-logo__img"></a>
  <nav class="site-nav">
    <a href="index.html">Home</a>
    <a href="events.html">Events</a>
    <a href="clubs.html">Clubs</a>
    <span id="authLinks">
      <a href="login.html">Login</a>
      <a href="register.html" class="active">Register</a>
    </span>
  </nav>
</header>

<div class="auth-page">

  <div class="auth-brand">
    <span class="brand-name">Nexus</span>
    <p>Create your account to get started.</p>
  </div>

  <p id="authMessage" class="auth-message"></p>

  <form class="card auth-form" method="post" action="/register">
    <input type="hidden" name="_csrf" id="csrfToken" value="">
    <label>Full Name
      <input type="text" name="fullName" placeholder="Enter your full name" required>
    </label>
    <label>Username
      <input type="text" name="username" placeholder="Enter your Username" required>
    </label>
    <label>Password
      <span style="position:relative; display:block; width:100%;">
        <input type="password" name="password" id="registerPassword" placeholder="Create a password" required
          style="width:100%; box-sizing:border-box; padding-right:64px;">
        <button type="button" onclick="togglePassword('registerPassword', this)"
          style="position:absolute; right:14px; top:50%; transform:translateY(-50%); background:none; border:none; color:var(--red-bright); cursor:pointer; font-size:0.85rem; font-weight:600; z-index:2;">Show</button>
      </span>
    </label>
    <label>Executive Access Code <span style="color:var(--text-faint);font-weight:400">(optional — club execs only)</span>
      <input type="text" name="execCode" placeholder="Leave blank if you're a student">
    </label>
    <button type="submit" class="btn-details" style="margin-top:8px;">Create Account</button>
  </form>

  <a href="login.html" class="exec-link">Already have an account? Log in</a>

</div>

<script src="js/auth.js"></script>
<script src="js/nav.js"></script>
<script src="js/balls.js"></script>
</body>
</html>
