<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Register — SFSS Nexus</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<header class="site-header">
  <span class="site-logo">SFSS Nexus</span>
  <nav class="site-nav">
    <a href="index.html">Home</a>
    <a href="events.html">Events</a>
    <a href="clubs.html">Clubs</a>
    <a href="login.html">Login</a>
    <a href="register.html" class="active">Register</a>
  </nav>
</header>

<div class="auth-page">

  <div class="auth-brand">
    <span class="brand-name">Nexus</span>
    <p>Create your account to get started.</p>
  </div>

  <p id="authMessage" class="auth-message"></p>

  <form class="card auth-form" method="post" action="/register">
    <input type="hidden" name="_csrf" id="csrfToken" value="">
    <label>Full Name
      <input type="text" name="fullName" placeholder="Enter your full name" required>
    </label>
    <label>Username
      <input type="text" name="username" placeholder="Enter your Username" required>
    </label>
    <label>Password
      <input type="password" name="password" placeholder="Create a password" required>
    </label>
    <button type="submit" class="btn-details" style="margin-top:8px;">Create Account</button>
  </form>

  <a href="login.html" class="exec-link">Already have an account? Log in</a>

</div>

<script src="js/auth.js"></script>
</body>
</html>
