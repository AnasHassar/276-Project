spring.application.name=SFSS-Nexus

spring.datasource.url=jdbc:postgresql://localhost:5432/sfss_nexus
spring.datasource.username=postgres
spring.datasource.password=password
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.url=${URL_DB:jdbc:postgresql://localhost:5432/mydatabase}
spring.datasource.username=${DB_USER:myuser}
spring.datasource.password=${DB_PASS:secret}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false

# Code an applicant must supply at registration to be granted an executive
# (ROLE_ADMIN) account instead of a regular student account.
app.security.exec-signup-code=${EXEC_SIGNUP_CODE:a}
spring.docker.compose.enabled=false