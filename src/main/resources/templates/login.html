<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Login - SFSS Nexus</title>
    <link rel="stylesheet" th:href="@{/css/login.css}"/>
</head>
<body>
<div class="card">
    <h2>SFSS Nexus</h2>
    <div th:if="${param.error}" class="msg msg-error">Invalid username or password.</div>
    <div th:if="${param.logout}" class="msg msg-success">You have been logged out.</div>
    <div th:if="${param.registered}" class="msg msg-success">Account created! Please log in.</div>
    <form method="post" action="/login">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
        <label for="username">Username</label>
        <input type="text" id="username" name="username" autofocus required/>
        <label for="password">Password</label>
        <input type="password" id="password" name="password" required/>
        <button type="submit" class="btn">Log In</button>
    </form>
    <div class="footer">
        <a href="/register">Don't have an account? Register</a>
    </div>
</div>
</body>
</html>
